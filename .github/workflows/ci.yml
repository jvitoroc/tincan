name: ci

on:
  push:
    # Tag pushes are covered by release.yml, which tests before building.
    branches: ["**"]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          # Latest 1.26 patch release (go-version-file would pin exactly 1.26.0 and
          # miss security fixes). Keep in step with the go line in go.mod.
          go-version: "1.26.x"
          check-latest: true

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      # The server must stay pure Go, and the client's !cgo stub path must
      # compile (that's what `CGO_ENABLED=0 go install` builds).
      - name: Build without cgo
        env:
          CGO_ENABLED: "0"
        run: go build ./cmd/tincan ./cmd/tincan-server
